name: lint
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '23 1 * * 1'

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint
        run: pnpm run lint

      - name: Smoke test the npm package
        run: |
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT
          pnpm pack --pack-destination "$package_dir"
          npm install --prefix "$package_dir" --ignore-scripts --no-audit --no-fund "$package_dir"/*.tgz
          node .github/scripts/smoke-package.mjs "$package_dir"

  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
      - name: Audit locked production dependencies
        run: |
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          cp pnpm-lock.yaml "$audit_dir/"
          cd "$audit_dir"
          # pnpm 11 uses the registry's bulk advisories endpoint.
          npm exec --yes --package=pnpm@11.28.11 -- pnpm audit --prod
